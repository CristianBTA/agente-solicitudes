name: validar-aporte
# Filtro automático de aportes: sin IA y sin llaves. No le gasta nada a nadie.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    # macOS: la caja de arena usa sandbox-exec, que solo existe ahí; en Linux B11 y B12 ceden (lección L42)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, fijada al commit
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, fijada al commit
        with:
          python-version: "3.13"
      - name: Instalar solo lo de requirements.txt, verificando la huella de cada paquete
        run: pip install --require-hashes -r requirements.txt
      - name: Filtro automático (archivos prohibidos, datos personales, seguridad, que no rompa nada y huecos nuevos)
        run: python herramientas/validar_aporte.py --base origin/${{ github.base_ref }}
